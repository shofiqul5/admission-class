<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Video Platform</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* FIX: the universal user-select:none above also disables typing/tap
           interactions on inputs in several mobile WebViews, which is what was
           breaking the search box. Explicitly restore normal text selection
           behavior for form fields. */
        input, textarea, select {
            user-select: text;
            -webkit-user-select: text;
        }

        body {
            background-color: #0f0f0f;
            color: #fff;
            padding: 20px;
        }

        /* Top Header & Search Area */
        .header-bar {
            max-width: 1400px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .brand-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ff0000;
            letter-spacing: 0.5px;
        }

        .search-box {
            position: relative;
            max-width: 400px;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 10px 16px;
            background: #1f1f1f;
            border: 1px solid #333;
            border-radius: 20px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .search-box input:focus {
            border-color: #ff0000;
            background: #252525;
        }

        /* Responsive Main Grid Layout */
        .main-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Player Section */
        .player-container {
            width: 100%;
        }

        .player-wrapper {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
            display: none;
        }

        /* Fullscreen Styling */
        .player-wrapper:fullscreen, .player-wrapper:-webkit-full-screen {
            padding-top: 0;
            width: 100vw;
            height: 100vh;
            border-radius: 0;
        }

        .player-content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .yt-frame-container {
            position: absolute;
            top: -60px;
            left: 0;
            width: 100%;
            height: calc(100% + 120px);
            pointer-events: none;
        }

        iframe, video {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .shield-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 48px);
            z-index: 10;
            background: transparent;
            cursor: pointer;
        }

        /* Custom Control Bar */
        .custom-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 48px;
            background: rgba(15, 15, 15, 0.9);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            padding: 0 15px;
            gap: 12px;
            z-index: 20;
            opacity: 1;
            transition: opacity 0.3s ease;
        }

        .custom-controls.controls-hidden {
            opacity: 0;
            pointer-events: none;
        }

        .btn-ctrl {
            background: none;
            border: none;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            outline: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-ctrl:hover {
            color: #ff0000;
        }

        .progress-container {
            flex-grow: 1;
            height: 5px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
            transition: height 0.1s;
        }

        .progress-container:hover {
            height: 8px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: #ff0000;
            border-radius: 3px;
            position: absolute;
            top: 0;
            left: 0;
        }

        .time-display {
            font-size: 12px;
            color: #ccc;
            min-width: 85px;
        }

        /* Quality Dropdown Selector */
        .quality-select {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            outline: none;
            cursor: pointer;
        }

        .quality-select:hover {
            border-color: #ff0000;
        }

        .video-title {
            margin-top: 15px;
            font-size: 1.3rem;
            font-weight: 600;
            color: #f1f1f1;
            display: none;
        }

        /* Sidebar Playlist */
        .playlist-sidebar {
            background: #181818;
            border-radius: 12px;
            padding: 15px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .playlist-sidebar h3 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #2a2a2a;
            color: #fff;
        }

        .video-item {
            display: flex;
            align-items: center;
            padding: 8px;
            background: #222;
            border-radius: 8px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            gap: 12px;
        }

        .video-item:hover {
            background: #2e2e2e;
        }

        .video-item.active {
            background: #333;
            border-left: 4px solid #ff0000;
        }

        .thumbnail-box {
            width: 100px;
            height: 56px;
            background-color: #000;
            border-radius: 6px;
            overflow: hidden;
            flex-shrink: 0;
        }

        .thumbnail-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
        }

        .video-info .title {
            font-size: 13px;
            font-weight: 500;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .loading-text {
            color: #888;
            font-size: 14px;
            text-align: center;
            padding: 20px 0;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- Top Header Area -->
    <div class="header-bar">
        <div class="brand-title">CLASSROOM PLAYER</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search video by title...">
        </div>
    </div>

    <div class="main-layout">
        <!-- Main Video Section -->
        <div class="player-container">
            <div id="playerWrapper" class="player-wrapper">
                <div id="playerContent" class="player-content"></div>
                
                <div id="shieldOverlay" class="shield-overlay"></div>

                <!-- Custom Controls -->
                <div class="custom-controls">
                    <button id="playBtn" class="btn-ctrl">▶</button>
                    <div id="progressContainer" class="progress-container">
                        <div id="progressBar" class="progress-bar"></div>
                    </div>
                    <span id="timeDisplay" class="time-display">00:00 / 00:00</span>
                    
                    <!-- Quality Select Dropdown -->
                    <select id="qualitySelect" class="quality-select">
                        <option value="auto">Auto</option>
                        <option value="hd1080">1080p</option>
                        <option value="hd720">720p</option>
                        <option value="large">480p</option>
                        <option value="medium">360p</option>
                    </select>

                    <button id="fullScreenBtn" class="btn-ctrl">⛶</button>
                </div>
            </div>

            <h2 id="currentTitle" class="video-title">Select a video to play</h2>
        </div>

        <!-- Sidebar Playlist -->
        <div class="playlist-sidebar">
            <h3>Class List</h3>
            <div id="videoList">
                <p class="loading-text">Loading video list...</p>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>

    <script>
        const linkUrl = 'https://raw.githubusercontent.com/shofiqul5/admission-class/main/video-link.txt';
        const titleUrl = 'https://raw.githubusercontent.com/shofiqul5/admission-class/main/video-titel.txt';
        const thumbUrl = 'https://raw.githubusercontent.com/shofiqul5/admission-class/main/video-thumbnail.txt';

        const playerWrapper = document.getElementById('playerWrapper');
        const playerContent = document.getElementById('playerContent');
        const shieldOverlay = document.getElementById('shieldOverlay');
        const playBtn = document.getElementById('playBtn');
        const progressBar = document.getElementById('progressBar');
        const progressContainer = document.getElementById('progressContainer');
        const timeDisplay = document.getElementById('timeDisplay');
        const qualitySelect = document.getElementById('qualitySelect');
        const fullScreenBtn = document.getElementById('fullScreenBtn');
        const currentTitleEl = document.getElementById('currentTitle');
        const videoListEl = document.getElementById('videoList');
        const searchInput = document.getElementById('searchInput');
        const customControls = document.querySelector('.custom-controls');

        let playlistData = [];
        let currentIndex = -1;
        let ytPlayer = null;
        let html5Player = null;
        let isYT = false;
        let updateTimer = null;
        let isPlayerPlaying = false;
        let hideControlsTimer = null;
        const HIDE_DELAY = 2500; // ms of inactivity before controls fade out

        // FIX: the YouTube IFrame API loads asynchronously. Clicking a video
        // before it's ready used to throw "YT is not defined". Track
        // readiness and queue the most recently requested video so it plays
        // as soon as the API finishes loading.
        let ytApiReady = (typeof YT !== 'undefined' && YT.Player);
        let pendingYtId = null;

        window.onYouTubeIframeAPIReady = function () {
            ytApiReady = true;
            if (pendingYtId !== null) {
                const idToPlay = pendingYtId;
                pendingYtId = null;
                createYouTubePlayer(idToPlay);
            }
        };

        // ---- Auto-hide controls ----
        function showControls() {
            customControls.classList.remove('controls-hidden');
            scheduleHideControls();
        }

        function hideControlsNow() {
            customControls.classList.add('controls-hidden');
        }

        function scheduleHideControls() {
            clearTimeout(hideControlsTimer);
            // Only auto-hide while the video is actually playing.
            if (isPlayerPlaying) {
                hideControlsTimer = setTimeout(hideControlsNow, HIDE_DELAY);
            }
        }

        // Block DevTools
        document.addEventListener('keydown', (e) => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || (e.ctrlKey && (e.key === 'U' || e.key === 'S'))) {
                e.preventDefault();
            }
        });

        function getYouTubeId(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        // Strips a leading numbering prefix like "1.", "1:", "1)" or Bengali
        // digits from a line — used for links, titles AND thumbnails so all
        // three lists stay aligned and thumbnail URLs are recognized correctly.
        function stripNumbering(line) {
            return line.replace(/^[0-9\u0966-\u096F]+[:.\)\s]*/, '').trim();
        }

        async function loadData() {
            try {
                const cacheBuster = `?t=${new Date().getTime()}`;
                const [linksRes, titlesRes, thumbsRes] = await Promise.all([
                    fetch(linkUrl + cacheBuster),
                    fetch(titleUrl + cacheBuster),
                    fetch(thumbUrl + cacheBuster).catch(() => null)
                ]);

                const linksText = await linksRes.text();
                const titlesText = await titlesRes.text();
                const thumbsText = thumbsRes ? await thumbsRes.text() : '';

                const links = linksText.split('\n').map(stripNumbering).filter(Boolean);
                const titles = titlesText.split('\n').map(stripNumbering).filter(Boolean);

                // FIX: previously thumbnail lines were only trimmed, never
                // stripped of their numbering prefix, so a line like
                // "1. https://..." failed the startsWith('http') check below
                // and silently fell back to the default YouTube thumbnail.
                // We keep blank lines here (no filter) so indexes stay
                // aligned with the links/titles arrays.
                const thumbs = thumbsText.split('\n').map(t => stripNumbering(t));

                playlistData = links.map((link, index) => {
                    const ytId = getYouTubeId(link);
                    let defaultThumb = ytId 
                        ? `https://img.youtube.com/vi/${ytId}/hqdefault.jpg` 
                        : 'https://via.placeholder.com/120x68?text=No+Thumb';

                    let customThumb = thumbs[index];
                    let finalThumb = (customThumb && customThumb.startsWith('http')) 
                        ? customThumb 
                        : defaultThumb;

                    return {
                        id: index,
                        link: link,
                        ytId: ytId,
                        title: titles[index] || `Video ${index + 1}`,
                        thumb: finalThumb,
                        fallbackThumb: defaultThumb
                    };
                });

                if (playlistData.length > 0) renderPlaylist(playlistData);
                else videoListEl.innerHTML = '<p class="loading-text">No videos found.</p>';
            } catch (error) {
                videoListEl.innerHTML = '<p class="loading-text">Error loading videos.</p>';
            }
        }

        function renderPlaylist(items) {
            videoListEl.innerHTML = '';
            if (items.length === 0) {
                videoListEl.innerHTML = '<p class="loading-text">No matching videos.</p>';
                return;
            }

            items.forEach((item) => {
                const div = document.createElement('div');
                div.className = `video-item ${item.id === currentIndex ? 'active' : ''}`;
                div.innerHTML = `
                    <div class="thumbnail-box">
                        <img src="${item.thumb}" onerror="this.onerror=null; this.src='${item.fallbackThumb}';">
                    </div>
                    <div class="video-info">
                        <span class="title">${item.title}</span>
                    </div>
                `;
                div.onclick = () => playVideo(item.id);
                videoListEl.appendChild(div);
            });
        }

        // Search Filter
        // FIX: this logic itself was fine, but the input never accepted focus
        ///typing reliably because of the global `user-select: none` rule —
        // fixed above in CSS. Also trim the query and guard against
        // playlistData not being loaded yet.
        searchInput.oninput = (e) => {
            const query = e.target.value.toLowerCase().trim();
            if (!playlistData.length) return;
            const filtered = query
                ? playlistData.filter(item => item.title.toLowerCase().includes(query))
                : playlistData;
            renderPlaylist(filtered);
        };

        function playVideo(index) {
            currentIndex = index;
            const item = playlistData[index];
            playerWrapper.style.display = 'block';
            currentTitleEl.style.display = 'block';
            currentTitleEl.innerText = item.title;

            clearInterval(updateTimer);
            clearTimeout(hideControlsTimer);
            customControls.classList.remove('controls-hidden');
            isPlayerPlaying = false;

            if (item.ytId) {
                isYT = true;
                qualitySelect.style.display = 'block';
                setupYouTubePlayer(item.ytId);
            } else {
                isYT = false;
                qualitySelect.style.display = 'none';
                setupHTML5Player(item);
            }
            renderPlaylist(playlistData);
        }

        function setupYouTubePlayer(ytId) {
            // FIX: don't touch the YT global until the API has actually
            // announced it's ready. If it hasn't, remember this video and
            // onYouTubeIframeAPIReady will start it once the API arrives.
            if (!ytApiReady || typeof YT === 'undefined' || !YT.Player) {
                pendingYtId = ytId;
                playerContent.innerHTML = '<p class="loading-text">Loading player…</p>';
                return;
            }

            createYouTubePlayer(ytId);
        }

        function createYouTubePlayer(ytId) {
            // The target div must exist in the DOM right before YT.Player()
            // is called — recreate it here so this works both for an
            // immediate play and for a queued one resumed later.
            playerContent.innerHTML = `<div class="yt-frame-container"><div id="ytContainer"></div></div>`;
            ytPlayer = new YT.Player('ytContainer', {
                videoId: ytId,
                playerVars: {
                    'autoplay': 1,
                    'controls': 0,
                    'modestbranding': 1,
                    'rel': 0,
                    'disablekb': 1,
                    'fs': 0
                },
                events: {
                    'onReady': (e) => {
                        e.target.playVideo();
                    },
                    'onStateChange': (e) => {
                        if (e.data === YT.PlayerState.PLAYING) {
                            playBtn.innerText = '⏸';
                            isPlayerPlaying = true;
                            startProgressLoop();
                            showControls();
                        } else if (e.data === YT.PlayerState.PAUSED) {
                            playBtn.innerText = '▶';
                            isPlayerPlaying = false;
                            clearTimeout(hideControlsTimer);
                            customControls.classList.remove('controls-hidden');
                        } else if (e.data === YT.PlayerState.ENDED) {
                            isPlayerPlaying = false;
                            clearTimeout(hideControlsTimer);
                            customControls.classList.remove('controls-hidden');
                            if (currentIndex + 1 < playlistData.length) playVideo(currentIndex + 1);
                        }
                    }
                }
            });
        }

        function setupHTML5Player(item) {
            pendingYtId = null; // FIX: don't let a stale queued YT video hijack playback later
            playerContent.innerHTML = `<video id="mainPlayer" style="object-fit:contain;"></video>`;
            html5Player = document.getElementById('mainPlayer');
            html5Player.src = item.link;

            html5Player.play();
            playBtn.innerText = '⏸';
            isPlayerPlaying = true;

            html5Player.addEventListener('play', () => {
                playBtn.innerText = '⏸';
                isPlayerPlaying = true;
                showControls();
            });
            html5Player.addEventListener('pause', () => {
                playBtn.innerText = '▶';
                isPlayerPlaying = false;
                clearTimeout(hideControlsTimer);
                customControls.classList.remove('controls-hidden');
            });
            html5Player.addEventListener('ended', () => {
                isPlayerPlaying = false;
                clearTimeout(hideControlsTimer);
                customControls.classList.remove('controls-hidden');
                if (currentIndex + 1 < playlistData.length) playVideo(currentIndex + 1);
            });

            startProgressLoop();
            showControls();
        }

        function togglePlay() {
            if (isYT && ytPlayer) {
                if (ytPlayer.getPlayerState() === YT.PlayerState.PLAYING) ytPlayer.pauseVideo();
                else ytPlayer.playVideo();
            } else if (html5Player) {
                if (html5Player.paused) html5Player.play();
                else html5Player.pause();
            }
        }

        playBtn.onclick = () => {
            togglePlay();
            showControls();
        };

        shieldOverlay.onclick = () => {
            if (customControls.classList.contains('controls-hidden')) {
                // First tap on a hidden-controls video just reveals them.
                showControls();
            } else {
                togglePlay();
                showControls();
            }
        };

        // Any interaction with the player area keeps controls visible a bit longer.
        playerWrapper.addEventListener('mousemove', showControls);
        playerWrapper.addEventListener('touchstart', showControls, { passive: true });
        progressContainer.addEventListener('mousedown', showControls);
        progressContainer.addEventListener('touchstart', showControls, { passive: true });

        /* Quality Switcher Engine */
        qualitySelect.onchange = (e) => {
            const selectedQuality = e.target.value;
            if (isYT && ytPlayer && ytPlayer.setPlaybackQuality) {
                ytPlayer.setPlaybackQuality(selectedQuality);
            }
        };

        function startProgressLoop() {
            clearInterval(updateTimer);
            updateTimer = setInterval(() => {
                let curr = 0, dur = 0;
                if (isYT && ytPlayer && ytPlayer.getCurrentTime) {
                    curr = ytPlayer.getCurrentTime();
                    dur = ytPlayer.getDuration();
                } else if (html5Player) {
                    curr = html5Player.currentTime;
                    dur = html5Player.duration;
                }

                if (dur > 0) {
                    progressBar.style.width = (curr / dur) * 100 + '%';
                    timeDisplay.innerText = `${formatTime(curr)} / ${formatTime(dur)}`;
                }
            }, 500);
        }

        function formatTime(sec) {
            let m = Math.floor(sec / 60);
            let s = Math.floor(sec % 60);
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        progressContainer.onclick = (e) => {
            const rect = progressContainer.getBoundingClientRect();
            const pos = (e.clientX - rect.left) / rect.width;

            if (isYT && ytPlayer && ytPlayer.getDuration) {
                const targetTime = pos * ytPlayer.getDuration();
                ytPlayer.seekTo(targetTime, true);
            } else if (html5Player) {
                const targetTime = pos * html5Player.duration;
                html5Player.currentTime = targetTime;
            }
        };

        async function toggleFullScreen() {
            try {
                if (!document.fullscreenElement) {
                    if (playerWrapper.requestFullscreen) {
                        await playerWrapper.requestFullscreen();
                    } else if (playerWrapper.webkitRequestFullscreen) {
                        await playerWrapper.webkitRequestFullscreen();
                    }

                    if (screen.orientation && screen.orientation.lock) {
                        await screen.orientation.lock('landscape').catch(() => {});
                    }
                } else {
                    if (document.exitFullscreen) {
                        await document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        await document.webkitExitFullscreen();
                    }

                    if (screen.orientation && screen.orientation.unlock) {
                        screen.orientation.unlock();
                    }
                }
            } catch (err) {
                console.log("Fullscreen Error:", err);
            }
        }

        fullScreenBtn.onclick = toggleFullScreen;

        loadData();
    </script>
</body>
</html>
